apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion-electronics-frontend
  namespace: fusion-ecommerce
  labels:
    app: fusion-electronics
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fusion-electronics
      component: frontend
  template:
    metadata:
      labels:
        app: fusion-electronics
        component: frontend
    spec:
      containers:
        - name: frontend
          image: fusion-ecommerce-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
