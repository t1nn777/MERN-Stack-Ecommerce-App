{{- if and .Values.observability.enabled .Values.observability.teamsAlert.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fusion-electronics.teamsAlertName" . }}
  namespace: {{ include "fusion-electronics.observabilityNamespace" . }}
  labels:
    {{- include "fusion-electronics.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fusion-electronics.teamsAlertName" . }}
  namespace: {{ include "fusion-electronics.namespace" . }}
  labels:
    {{- include "fusion-electronics.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fusion-electronics.teamsAlertName" . }}
  namespace: {{ include "fusion-electronics.namespace" . }}
  labels:
    {{- include "fusion-electronics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fusion-electronics.teamsAlertName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fusion-electronics.teamsAlertName" . }}
    namespace: {{ include "fusion-electronics.observabilityNamespace" . }}
{{- end }}
