apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion-electronics-backend
  namespace: fusion-ecommerce
  labels:
    app: fusion-electronics
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fusion-electronics
      component: backend
  template:
    metadata:
      labels:
        app: fusion-electronics
        component: backend
    spec:
      containers:
        - name: backend
          image: fusion-ecommerce-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: fusion-electronics-config
            - secretRef:
                name: fusion-electronics-secrets
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
