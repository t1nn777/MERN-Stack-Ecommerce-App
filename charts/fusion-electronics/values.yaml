namespaceOverride: fusion-ecommerce

nameOverride: ""
fullnameOverride: ""

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/your-org/mern-ecom-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/your-org/mern-ecom-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  containerPort: 8000
  env:
    NODE_ENV: production
    PORT: "8000"
    SKIP_SEED_ON_START: "false"
    FORCE_SEED_ON_START: "false"
    PINECONE_INDEX: ecommerce-products
    PINECONE_NAMESPACE: ecommerce-products
    PINECONE_PURGE_ON_SYNC: "false"
    RECOMMENDATION_PREFER_WEAVIATE: "false"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10

secrets:
  JWT_SECRET: change-me-before-production
  MONGO_URI: ""
  PINECONE_API_KEY: ""
  PINECONE_HOST: ""
  PINECONE_INDEX: ecommerce-products
  GOOGLE_AI_API_KEY: ""
  WEAVIATE_HOST: ""
  WEAVIATE_API_KEY: ""

mongodb:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  primary:
    persistence:
      enabled: true
      size: 8Gi
  database: Ecommerce-Products
  service:
    ports:
      mongodb: 27017

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: fusion-electronics.local
      paths:
        - path: /api-docs
          pathType: Prefix
          service: backend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls: []

autoscaling:
  enabled: true
  frontend:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  backend:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: false
  ingressNamespaceLabel:
    name: ingress-nginx
