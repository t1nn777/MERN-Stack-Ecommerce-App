namespaceOverride: fusion-ecommerce

nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: ghcr-secret

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/t1nn777/mern-ecom-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 248Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    path: /
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/t1nn777/mern-ecom-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  containerPort: 8000
  env:
    NODE_ENV: production
    PORT: "8000"
    SKIP_SEED_ON_START: "false"
    FORCE_SEED_ON_START: "false"
    PINECONE_INDEX: ecommerce-products
    PINECONE_NAMESPACE: ecommerce-products
    PINECONE_PURGE_ON_SYNC: "false"
    RECOMMENDATION_PREFER_WEAVIATE: "false"
    HEALTH_CHECK_ENDPOINT: /health
    READINESS_CHECK_ENDPOINT: /health/ready
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 18

secrets:
  JWT_SECRET: ""
  PINECONE_API_KEY: ""
  PINECONE_HOST: ""
  PINECONE_INDEX: ecommerce-products
  WEAVIATE_HOST: ""
  WEAVIATE_API_KEY: ""

mongodb:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 5Gi
  database: Ecommerce-Products
  service:
    ports:
      mongodb: 27017

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: highego.com
      paths:
        - path: /api-docs
          pathType: Prefix
          service: backend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls: []

autoscaling:
  enabled: true
  frontend:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  backend:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: false
  ingressNamespaceLabel:
    name: ingress-nginx

observability:
  enabled: false
  namespace: logging
  createNamespace: true

  elasticsearch:
    host: "192.168.1.250"
    port: "9200"
    username: elastic
    password: ""
    existingCaSecret: elasticsearch-ca
    caFileKey: ca.crt

  fluentBit:
    enabled: true
    image:
      repository: fluent/fluent-bit
      tag: "3.2"
      pullPolicy: IfNotPresent
    logstashPrefix: k8s-logs-mern
    namespaceFilter: fusion-ecommerce
    podNameRegex: "^(fusion-electronics-(backend|frontend)-|attack-log-generator$)"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

  teamsAlert:
    enabled: true
    image:
      repository: alpine/k8s
      tag: "1.30.0"
      pullPolicy: IfNotPresent
    schedule: "*/5 * * * *"
    webhookUrl: ""
    esIndexPattern: "k8s-logs-mern-*"
    kibanaUrl: "https://192.168.1.250:5601"
    lookbackMinutes: "5"
    maxAlertsPerRun: "10"
    restartThreshold: "3"
    dryRun: "false"
