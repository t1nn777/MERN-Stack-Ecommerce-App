{{- if and .Values.observability.enabled .Values.observability.fluentBit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fusion-electronics.fluentBitName" . }}-config
  namespace: {{ include "fusion-electronics.observabilityNamespace" . }}
  labels:
    {{- include "fusion-electronics.labels" . | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush              5
        Daemon             Off
        Log_Level          info
        Parsers_File       parsers.conf
        HTTP_Server        On
        HTTP_Listen        0.0.0.0
        HTTP_Port          2020

    [INPUT]
        Name               tail
        Tag                kube.*
        Path               /var/log/containers/*.log
        DB                 /var/log/fluent-bit/flb_kube.db
        Parser             cri
        Mem_Buf_Limit      10MB
        Skip_Long_Lines    On
        Refresh_Interval   10
        Read_from_Head     On

    [FILTER]
        Name               kubernetes
        Match              kube.*
        Kube_Tag_Prefix    kube.var.log.containers.
        Kube_URL           https://kubernetes.default.svc:443
        Kube_CA_File       /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File    /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log          On
        Keep_Log           On
        Labels             On
        Annotations        Off

    [FILTER]
        Name               grep
        Match              kube.*
        Regex              $kubernetes['namespace_name'] ^{{ .Values.observability.fluentBit.namespaceFilter }}$

    [FILTER]
        Name               grep
        Match              kube.*
        Regex              $kubernetes['pod_name'] {{ .Values.observability.fluentBit.podNameRegex }}

    [OUTPUT]
        Name               es
        Match              kube.*
        Host               ${FLUENT_ELASTICSEARCH_HOST}
        Port               ${FLUENT_ELASTICSEARCH_PORT}
        HTTP_User          ${FLUENT_ELASTICSEARCH_USER}
        HTTP_Passwd        ${FLUENT_ELASTICSEARCH_PASSWORD}
        Logstash_Format    On
        Logstash_Prefix    {{ .Values.observability.fluentBit.logstashPrefix }}
        Replace_Dots       On
        Suppress_Type_Name On
        Retry_Limit        False
        Trace_Error        On
        tls                On
        tls.verify         On
        tls.ca_file        /fluent-bit/tls/ca.crt

  parsers.conf: |
    [PARSER]
        Name               cri
        Format             regex
        Regex              ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key           time
        Time_Format        %Y-%m-%dT%H:%M:%S.%L%z
{{- end }}
