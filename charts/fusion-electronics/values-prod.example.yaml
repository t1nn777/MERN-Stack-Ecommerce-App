frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/YOUR_ORG/mern-ecom-frontend
    tag: CHANGE_ME

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/YOUR_ORG/mern-ecom-backend
    tag: CHANGE_ME
  env:
    SKIP_SEED_ON_START: "true"
    PINECONE_PURGE_ON_SYNC: "false"

secrets:
  JWT_SECRET: replace-with-a-strong-secret
  PINECONE_API_KEY: ""
  PINECONE_HOST: ""
  PINECONE_INDEX: ecommerce-products
  GOOGLE_AI_API_KEY: ""

mongodb:
  enabled: true
  auth:
    enabled: true
    rootPassword: replace-with-a-strong-root-password
    username: fusion
    password: replace-with-a-strong-user-password
    database: Ecommerce-Products
  primary:
    persistence:
      enabled: true
      size: 20Gi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: fusion-electronics.example.com
      paths:
        - path: /api-docs
          pathType: Prefix
          service: backend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: fusion-electronics-tls
      hosts:
        - fusion-electronics.example.com

autoscaling:
  enabled: true

networkPolicy:
  enabled: true
