name: Fusion Electronics CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: mern-ecom-frontend
  BACKEND_IMAGE_NAME: mern-ecom-backend
  HELM_RELEASE: fusion-electronics
  HELM_NAMESPACE: fusion-ecommerce
  CHART_PATH: charts/fusion-electronics

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test -- src/tests --runInBand

      - name: Test backend
        run: npm test --workspace backend -- --runInBand

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency update "${CHART_PATH}"
          helm lint "${CHART_PATH}"
          helm template "${HELM_RELEASE}" "${CHART_PATH}" --namespace "${HELM_NAMESPACE}" > /tmp/fusion-electronics-rendered.yaml

  docker:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_owner: ${{ steps.image-meta.outputs.image_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner
        id: image-meta
        shell: bash
        run: |
          image_owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_OWNER=${image_owner}" >> "$GITHUB_ENV"
          echo "image_owner=${image_owner}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.image_owner }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.image_owner }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.image_owner }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.image_owner }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  helm-deploy:
    name: Deploy with Helm
    runs-on: ubuntu-latest
    needs: docker
    environment: production
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
      PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
      WEAVIATE_HOST: ${{ secrets.WEAVIATE_HOST }}
      WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
    steps:
      - name: Check deploy secrets
        id: deploy-gate
        shell: bash
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA is not configured; skipping Helm deploy."
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET is required when KUBE_CONFIG_DATA is configured."
            exit 1
          fi

          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.deploy-gate.outputs.deploy_enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Helm
        if: steps.deploy-gate.outputs.deploy_enabled == 'true'
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        if: steps.deploy-gate.outputs.deploy_enabled == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Build Helm dependencies
        if: steps.deploy-gate.outputs.deploy_enabled == 'true'
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency update "${CHART_PATH}"

      - name: Deploy chart
        if: steps.deploy-gate.outputs.deploy_enabled == 'true'
        shell: bash
        run: |
          helm upgrade --install "${HELM_RELEASE}" "${CHART_PATH}" \
            --namespace "${HELM_NAMESPACE}" \
            --create-namespace \
            --set frontend.image.repository="${REGISTRY}/${{ needs.docker.outputs.image_owner }}/${FRONTEND_IMAGE_NAME}" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            --set backend.image.repository="${REGISTRY}/${{ needs.docker.outputs.image_owner }}/${BACKEND_IMAGE_NAME}" \
            --set backend.image.tag="${GITHUB_SHA}" \
            --set-string secrets.JWT_SECRET="${JWT_SECRET}" \
            --set-string secrets.PINECONE_API_KEY="${PINECONE_API_KEY}" \
            --set-string secrets.PINECONE_HOST="${PINECONE_HOST}" \
            --set-string secrets.PINECONE_INDEX="${PINECONE_INDEX:-ecommerce-products}" \
            --set-string secrets.WEAVIATE_HOST="${WEAVIATE_HOST}" \
            --set-string secrets.WEAVIATE_API_KEY="${WEAVIATE_API_KEY}" \
            --wait \
            --timeout 10m

      - name: Show rollout status
        if: steps.deploy-gate.outputs.deploy_enabled == 'true'
        run: |
          kubectl get pods -n "${HELM_NAMESPACE}"
          kubectl get ingress -n "${HELM_NAMESPACE}"
